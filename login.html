<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - HSE Art and Design School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="header__top">
            <img src="images/HSE_UNIVERSITY_ART_AND_DESIGN.png" height="30" width="270" alt="HSE University Art and Design" class="header__logo">
            <div class="header__actions">
                <a href="index.html" class="btn-black">← На главную</a>
                <a href="catalog.html" class="btn-outline">📚 КАТАЛОГ</a>
                <a href="register.html" class="btn-outline">📝 РЕГИСТРАЦИЯ</a>
            </div>
        </div>
    </div>
</header>

<main>
    <section class="auth-section">
        <div class="container">
            <h1 class="auth-title">ВХОД В СИСТЕМУ</h1>

            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="loginEmail" class="form-label">
                        Email или телефон <span class="required">*</span>
                    </label>
                    <input
                            type="text"
                            id="loginEmail"
                            name="loginEmail"
                            class="form-input"
                            placeholder="example@domain.com или +375 (__) ___-__-__"
                            required
                    >
                    <span class="error-message" id="loginEmailError"></span>
                </div>

                <div class="form-group">
                    <label for="loginPassword" class="form-label">
                        Пароль <span class="required">*</span>
                    </label>
                    <input
                            type="password"
                            id="loginPassword"
                            name="loginPassword"
                            class="form-input"
                            placeholder="Введите пароль"
                            required
                    >
                    <span class="error-message" id="loginPasswordError"></span>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span class="checkbox-text">Запомнить меня</span>
                    </label>
                </div>

                <button type="submit" class="btn-submit" id="loginSubmitBtn">
                    Войти
                </button>

                <p class="auth-link">
                    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
                </p>
            </form>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="container">
        <div class="footer__bottom">
            <div class="footer__copyright">
                © 1993–2022 Национальный исследовательский университет «Высшая школа экономики»
            </div>
        </div>
    </div>
</footer>

<script src="js/login.js"></script>

</body>
</html>
