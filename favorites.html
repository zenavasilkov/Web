<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранное - HSE Art and Design School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/favorites.css">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="header__top">
            <img src="images/HSE_UNIVERSITY_ART_AND_DESIGN.png" height="30" width="270" alt="HSE University Art and Design" class="header__logo">
            <div class="header__actions">
                <a href="index.html" class="btn-black header_to_main_button">← <span class="header__actions_text">&nbspНа главную</span></a>
                <a href="catalog.html" class="btn-outline">📚 КАТАЛОГ</a>
                <a href="favorites.html" class="btn-outline">❤️ ИЗБРАННОЕ</a>
                <a href="#" class="btn-outline" id="logoutBtn">🚪 <span class="header__actions_text">Выйти</span></a>
            </div>
        </div>
    </div>
</header>

<main>
    <section class="favorites-section">
        <div class="container">
            <h1 class="favorites-title">❤️ ИЗБРАННОЕ</h1>

            <div id="favoritesContainer" class="favorites-grid"></div>

            <div id="noFavorites" class="no-favorites" style="display: none;">
                <h3>😕 В избранном пока пусто</h3>
                <p>Добавьте программы из каталога, чтобы они появились здесь</p>
                <a href="catalog.html" class="btn-black" style="display: inline-block; margin-top: 20px;">Перейти в каталог</a>
            </div>

            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Загрузка...</p>
            </div>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="container">
        <div class="footer__bottom">
            <div class="footer__copyright">
                © 1993–2022 Национальный исследовательский университет «Высшая школа экономики»
            </div>
        </div>
    </div>
</footer>

<script src="js/api.js"></script>
<script src="js/favorites.js"></script>
<script src="js/logout.js"></script>

</body>
</html>
