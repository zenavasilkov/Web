<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - HSE Art and Design School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div id="preloader" class="preloader">
    <div class="preloader__spinner"></div>
    <div class="preloader__logo">
        <img src="images/HSE_UNIVERSITY_ART_AND_DESIGN.png" alt="HSE">
    </div>
</div>

<header class="header">
    <div class="container">
        <div class="header__top">
            <img src="images/HSE_UNIVERSITY_ART_AND_DESIGN.png" height="30" width="270" alt="HSE University Art and Design" class="header__logo">
            <div class="header__actions">
                <a href="index.html" class="btn-black header_to_main_button">← <span class="header__actions_text">&nbspНа главную</span></a>
                <a href="catalog.html" class="btn-outline">📚 КАТАЛОГ</a>
                <a href="#" class="btn-outline" id="logoutBtn">🚪 <span class="header__actions_text">Выйти</span></a>
            </div>
        </div>
    </div>
</header>

<main>
    <section class="admin-section">
        <div class="container">
            <h1 class="admin-title">АДМИН-ПАНЕЛЬ</h1>

            <div class="admin-tabs">
                <button class="tab-btn active" data-tab="products">📦 Товары</button>
                <button class="tab-btn" data-tab="feedback">💬 Отзывы</button>
                <button class="tab-btn" data-tab="users">👥 Пользователи</button>
                <button class="tab-btn" data-tab="orders">🛒 Заказы</button>
            </div>

            <div class="tab-content active" id="productsTab">
                <h2 class="tab-title">Управление товарами</h2>

                <form id="productForm" class="admin-form" novalidate>
                    <input type="hidden" id="productId">

                    <div class="form-row">
                        <div class="form-group">
                            <label for="productName" class="form-label">Название <span class="required">*</span></label>
                            <input type="text" id="productName" class="form-input" required>
                            <span class="error-message" id="productNameError"></span>
                        </div>

                        <div class="form-group">
                            <label for="productCategory" class="form-label">Категория <span class="required">*</span></label>
                            <select id="productCategory" class="form-input" required>
                                <option value="">-- Выберите --</option>
                                <option value="design">Дизайн</option>
                                <option value="art">Искусство</option>
                                <option value="tech">Технологии</option>
                                <option value="media">Медиа</option>
                            </select>
                            <span class="error-message" id="productCategoryError"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="productDescription" class="form-label">Описание <span class="required">*</span></label>
                        <textarea id="productDescription" class="form-input" rows="4" required></textarea>
                        <span class="error-message" id="productDescriptionError"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="productPrice" class="form-label">Цена (₽) <span class="required">*</span></label>
                            <input type="number" id="productPrice" class="form-input" required min="0">
                            <span class="error-message" id="productPriceError"></span>
                        </div>

                        <div class="form-group">
                            <label for="productDuration" class="form-label">Длительность (мес) <span class="required">*</span></label>
                            <input type="number" id="productDuration" class="form-input" required min="1">
                            <span class="error-message" id="productDurationError"></span>
                        </div>

                        <div class="form-group">
                            <label for="productRating" class="form-label">Рейтинг <span class="required">*</span></label>
                            <input type="number" id="productRating" class="form-input" required min="0" max="5" step="0.1">
                            <span class="error-message" id="productRatingError"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="productImage" class="form-label">URL изображения <span class="required">*</span></label>
                        <input type="url" id="productImage" class="form-input" required>
                        <span class="error-message" id="productImageError"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="productLevel" class="form-label">Уровень <span class="required">*</span></label>
                            <select id="productLevel" class="form-input" required>
                                <option value="">-- Выберите --</option>
                                <option value="Бакалавриат">Бакалавриат</option>
                                <option value="Магистратура">Магистратура</option>
                                <option value="ДПО">ДПО</option>
                            </select>
                            <span class="error-message" id="productLevelError"></span>
                        </div>

                        <div class="form-group">
                            <label for="productLanguage" class="form-label">Язык <span class="required">*</span></label>
                            <input type="text" id="productLanguage" class="form-input" value="Русский" required>
                            <span class="error-message" id="productLanguageError"></span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-submit" id="productSubmitBtn" disabled>Сохранить</button>
                        <button type="button" class="btn-cancel" id="productCancelBtn">Отмена</button>
                    </div>
                </form>

                <div class="admin-list">
                    <h3 class="list-title">Все товары</h3>
                    <div id="productsList" class="admin-list-container"></div>
                </div>
            </div>

            <div class="tab-content" id="feedbackTab">
                <h2 class="tab-title">Управление отзывами</h2>

                <div class="filter-group">
                    <label>Фильтр по товару:</label>
                    <select id="feedbackProgramFilter" class="form-input">
                        <option value="all">Все товары</option>
                    </select>

                    <label>Фильтр по пользователю:</label>
                    <select id="feedbackUserFilter" class="form-input">
                        <option value="all">Все пользователи</option>
                    </select>
                </div>

                <div id="feedbacksList" class="admin-list-container"></div>
            </div>

            <div class="tab-content" id="usersTab">
                <h2 class="tab-title">Пользователи</h2>
                <div id="usersList" class="admin-list-container"></div>
            </div>

            <div class="tab-content" id="ordersTab">
                <h2 class="tab-title">Заказы</h2>
                <div id="ordersList" class="admin-list-container"></div>
            </div>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="container">
        <div class="footer__bottom">
            <div class="footer__copyright">
                © 1993–2022 Национальный исследовательский университет «Высшая школа экономики»
            </div>
        </div>
    </div>
</footer>

<script src="js/admin.js"></script>
<script src="js/logout.js"></script>
<script src="js/preloader.js"></script>

</body>
</html>
